
<div class="auth-container">
  <div class="auth-card">
    <h2>
        <span *ngIf="isLoginMode">⚡ Login to AgileDrift</span>
        <span *ngIf="!isLoginMode">🚀 Create Account</span>
    </h2>

    <form #authForm="ngForm" (ngSubmit)="onSubmit()">
      
      <div *ngIf="!isLoginMode">
        <div class="input-group">
           <span class="input-icon">👤</span>
           <input type="text" name="username" placeholder="Username" [(ngModel)]="authData.username" required>
        </div>
    
        <div class="input-group">
           <span class="input-icon">✉️</span>
           <input type="email" name="email" placeholder="Email Address" [(ngModel)]="authData.email" required>
        </div>

        <div class="input-group">
           <span class="input-icon">📞</span>
           <input type="tel" name="phone" placeholder="Phone Number" [(ngModel)]="authData.phone" required>
        </div>
      </div>

      <div *ngIf="isLoginMode">
        <div class="input-group">
           <span class="input-icon">👤</span>
           <input type="text" name="loginId" placeholder="Email, Username, or Phone" [(ngModel)]="authData.loginIdentifier" required>
        </div>
      </div>

      <div class="input-group">
        <span class="input-icon">🔒</span>
        <input [type]="passwordVisible ? 'text' : 'password'" name="password" placeholder="Password" [(ngModel)]="authData.password" required>
        <span class="eye-icon-toggle" (click)="togglePassword()">
           {{ passwordVisible ? '👁️' : '🙈' }}
        </span>
      </div>

      <button type="submit" [disabled]="!authForm.valid" class="btn-primary">
        {{ isLoginMode ? 'Login' : 'Sign Up' }}
      </button>
    </form>

    <div class="social-login">
      <p>Or continue with</p>
      <button type="button" class="google-btn">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="18">
        Google
      </button>
    </div>

    <p class="toggle-text" style="margin-top: 20px; color: #666;">
      {{ isLoginMode ? "New here?" : "Already have an account?" }}
      <span (click)="onSwitchMode()" style="color: #007bff; cursor: pointer; font-weight: bold;">
        {{ isLoginMode ? 'Register now' : 'Login instead' }}
      </span>
    </p>
  </div>
</div>
